services:
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/info')"]
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 2s

  proxy:
    build:
      context: ./proxy
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy

  test-runner:
    build:
      context: ./test-runner
    depends_on:
      proxy:
        condition: service_started
      backend:
        condition: service_healthy
    environment:
      - PROXY_URL=http://proxy:80